name: Bug report
description: Report a crash, rendering error, or functional regression
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** attach game files, XEX, or copyrighted screenshots. Describe behavior only.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android ARM64
        - Android x86_64
        - Windows D3D12
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / GPU / driver
      placeholder: e.g. POCO F7, Adreno 825, driver build ...
  - type: input
    id: commit
    attributes:
      label: Git commit or APK build date
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt (no game paths with personal data)
      description: Use code fences; redact usernames/paths if needed.